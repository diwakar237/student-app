name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Source Code Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Continuous Integration (Install & Test)
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 4. Build & Push Docker Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/student-app
        
        docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
        docker push $IMAGE_NAME:$IMAGE_TAG
        docker push $IMAGE_NAME:latest

    - name: 5. Deployment Setup (Prepare Manifest)
      run: |
        sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s-deployment.yaml
        sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s-deployment.yaml
        echo "Manifest successfully updated for local deployment tracking."